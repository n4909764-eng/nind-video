<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slind AI - Video Creation Platform</title>
    <meta name="description" content="AI Video Creation platform with auto script generation, voiceover narration, animated typography, device mockups, and dynamic video rendering." />
    <meta property="og:title" content="Slind AI - Video Creation Platform" />
    <meta property="og:description" content="AI Video Creation platform with auto script generation, voiceover narration, animated typography, device mockups, and dynamic video rendering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('slind_theme') || 'system';
          var theme = saved;
          if (saved === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();

      // Ignore Vite HMR WebSocket connection errors in iFrame
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          msg.includes('vite') ||
          stack.includes('@vite/client')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (e) {
        var msg = e.message || '';
        var filename = e.filename || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          filename.includes('@vite/client')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-black text-white antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
